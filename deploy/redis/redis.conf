# 本地开发用 Redis 配置
#
# 目标是**尽可能贴近生产**（阿里云 Redis 7.0 标准版 / 主从）。
# 每一项都写了为什么，改之前先看注释 —— 这里面有几个默认值一旦踩中，
# 症状是「session 莫名卡死」或「消息悄悄少了一条」，事后基本查不出来。
#
# 对应文档：开发规划.md A 节（选型）/ C 节（键命名）/ F 节（不变量）

# ============================== 网络 ==============================
bind 0.0.0.0
# 容器内不开保护模式；对外暴露由 docker-compose 只绑 127.0.0.1 控制，
# 不要把端口映射改成 0.0.0.0 —— 那等于在局域网上放了一个无鉴权 Redis
protected-mode no
port 6379
tcp-keepalive 300
# 永不主动断开空闲连接。Lettuce 的连接是长连接，被动断开只会制造无谓的重连抖动
timeout 0

# ============================== 架构 ==============================
# 标准版（主从），不开集群。
# Lua 的槽约束只存在于集群架构：标准版上 {s07} hash tag 退化为普通字符、零成本，
# 将来要迁集群版时键名一个字都不用改 —— 这就是现在就保留 hash tag 的理由（INV-9）。
cluster-enabled no

# ============================ 内存策略 ============================
maxmemory 512mb

# ★ 全文件最危险的一项。
#
# 允许淘汰意味着 Redis 可能悄悄删掉一个 lease、一个 cursor、或 inbox 里的一条指令，
# 并且**不会有任何报错**。表现是 session 永久卡死或者同一个 turn 双跑，
# 而 Redis 侧的监控一切正常。
#
# noeviction 让内存打满时写入直接失败 —— 故障变成响亮的，而不是安静的。
# 生产实例也必须是这个值。
maxmemory-policy noeviction

# ============================== 持久化 ==============================
# 关掉 RDB、只留 AOF：恢复路径只有一条。
# 验收「进程重启后相同 (userId, sessionId) 能接着聊」时，
# 不需要去分辨数据到底来自哪个快照。
save ""
appendonly yes
appendfsync everysec
dir /data

# =============================== Lua ===============================
# 摘牌脚本与 ctrl 状态脚本都在微秒级。
# 一旦有脚本逼近这个阈值，说明脚本里混进了循环或大 key 遍历 —— 那是设计错误。
# 正确的反应是去改脚本，不是调大这个值。
lua-time-limit 5000

# =============================== 流 ================================
# inbox / outbox / ctrl-stream / ready 全是 Stream。
# 节点条数保持默认：调大省内存但会让按 ID 裁剪的粒度变粗。
stream-node-max-entries 100

# ============================== 通知 ==============================
# 刻意留空。
# 跨节点中断复用 inbox + 200ms 轮询，不开 pub/sub，也不用 keyspace 通知 ——
# 少一条与 lease 绑定的订阅（订阅生命周期本身就是泄漏风险）。
notify-keyspace-events ""

# ============================== 慢查询 =============================
# 10ms 就记。本项目所有 Redis 命令都应当是微秒级，
# 任何超过 10ms 的都值得看一眼 —— 通常是脚本写错或者扫了大 key。
slowlog-log-slower-than 10000
slowlog-max-len 256

# ============================== 客户端 =============================
# 这个上限存在的意义不是限流，是让 INV-12 被违反时能早点炸出来：
# 一旦有人写了 XREAD BLOCK，阻塞命令独占连接，
# Redis 连接数会随 SSE 连接数线性放大，几千就打满。
maxclients 10000

# =============================== 日志 ==============================
loglevel notice
